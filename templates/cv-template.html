<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Currículo - {{name}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #0066cc;
            font-size: 24pt;
            margin: 0 0 10px 0;
        }
        
        .contact-info {
            font-size: 10pt;
            color: #666;
        }
        
        .contact-info p {
            margin: 3px 0;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: #0066cc;
            font-size: 13pt;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        
        .section-content {
            margin-left: 10px;
        }
        
        .experience-item,
        .education-item,
        .reference-item {
            margin-bottom: 12px;
        }
        
        .experience-item h4,
        .education-item h4 {
            color: #0066cc;
            margin: 0 0 3px 0;
            font-size: 11pt;
        }
        
        .position,
        .course {
            font-weight: bold;
            margin: 2px 0;
            font-size: 10pt;
        }
        
        .period,
        .institution {
            font-style: italic;
            color: #666;
            font-size: 10pt;
            margin: 2px 0;
        }
        
        .description {
            margin: 5px 0;
            font-size: 10pt;
        }
        
        .reference-item p {
            margin: 2px 0;
            font-size: 10pt;
        }
        
        .reference-name {
            font-weight: bold;
            color: #0066cc;
        }
        
        .footer {
            text-align: center;
            font-size: 8pt;
            color: #999;
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>{{name}}</h1>
            <div class="contact-info">
                <p><strong>Email:</strong> {{email}} | <strong>Telefone:</strong> {{phone}}</p>
                <p><strong>Endereço:</strong> {{address}}</p>
                <p><strong>Idade:</strong> {{age}} anos</p>
            </div>
        </div>
        
        <!-- Objetivo Profissional -->
        <div class="section">
            <h2>Objetivo Profissional</h2>
            <div class="section-content">
                <p>{{objective}}</p>
            </div>
        </div>
        
        <!-- Formação Acadêmica -->
        <div class="section">
            <h2>Formação Acadêmica</h2>
            <div class="section-content">
                {{education}}
            </div>
        </div>
        
        <!-- Experiência Profissional -->
        <div class="section">
            <h2>Experiência Profissional</h2>
            <div class="section-content">
                {{experiences}}
            </div>
        </div>
        
        <!-- Referências -->
        <div class="section">
            <h2>Referências</h2>
            <div class="section-content">
                {{references}}
            </div>
        </div>
        
        
        <!-- Rodapé -->
        <div class="footer">
            <p>Currículo gerado em {{generation_date}}</p>
        </div>
    </div>
</body>
</html>
